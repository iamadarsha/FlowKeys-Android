<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B4A" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#00E699" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f293d" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#131b2a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)" stroke="#233044" stroke-width="2"/>
  
  <!-- Subtle decorative ambient blobs -->
  <circle cx="150" cy="100" r="160" fill="#FF6B4A" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1050" cy="300" r="180" fill="#00E699" opacity="0.07" filter="url(#glow)"/>
  <circle cx="650" cy="200" r="220" fill="#8B5CF6" opacity="0.05" filter="url(#glow)"/>

  <!-- Logo Pill Icon -->
  <g transform="translate(80, 75)">
    <rect width="72" height="72" rx="22" fill="#1b2434" stroke="#FF6B4A" stroke-width="2.5" />
    <!-- Microphone Icon -->
    <path d="M36 22 C32.7 22 30 24.7 30 28 L30 38 C30 41.3 32.7 44 36 44 C39.3 44 42 41.3 42 38 L42 28 C42 24.7 39.3 22 36 22 Z" fill="#FF6B4A" />
    <path d="M24 35 C24 41.6 29.4 47 36 47 C42.6 47 48 41.6 48 35" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" fill="none"/>
    <line x1="36" y1="47" x2="36" y2="53" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round"/>
    <line x1="28" y1="53" x2="44" y2="53" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round"/>
  </g>

  <!-- Main Title -->
  <text x="175" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">
    FlowKeys <tspan fill="#FF6B4A">Android</tspan>
  </text>
  <text x="175" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#94A3B8" letter-spacing="1.2">
    WHISPERFLOW-GRADE INTELLIGENCE · NATIVE FLOATING IME COMPANION
  </text>

  <!-- Subtitle / Tagline -->
  <text x="80" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#E2E8F0">
    Frontier voice-to-text dictation &amp; Kolkata/West Bengal Bengali, Hindi, and English semantic translation.
  </text>
  <text x="80" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94A3B8">
    Operates strictly above soft keyboards (Gboard), zero phantom overlay, and 100% offline neural fallback.
  </text>

  <!-- Feature Metric Badges -->
  <g transform="translate(80, 275)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)">
      <rect width="235" height="90" rx="14" fill="url(#cardGrad)" stroke="#2b3952" stroke-width="1.5"/>
      <text x="20" y="36" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#00E699">Gemini 3.5 Flash</text>
      <text x="20" y="58" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">500 Free Requests / Day</text>
      <text x="20" y="74" font-family="-apple-system, sans-serif" font-size="11" font-weight="400" fill="#64748B">15 RPM · Sub-Second Latency</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(255, 0)">
      <rect width="235" height="90" rx="14" fill="url(#cardGrad)" stroke="#2b3952" stroke-width="1.5"/>
      <text x="20" y="36" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#FF6B4A">WB Bengali &amp; Hindi</text>
      <text x="20" y="58" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Kolkata Colloquial Engine</text>
      <text x="20" y="74" font-family="-apple-system, sans-serif" font-size="11" font-weight="400" fill="#64748B">Benglish · Hinglish · Proper Nouns</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(510, 0)">
      <rect width="235" height="90" rx="14" fill="url(#cardGrad)" stroke="#2b3952" stroke-width="1.5"/>
      <text x="20" y="36" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#8B5CF6">Zero Phantom Pill</text>
      <text x="20" y="58" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">IME-Synced Floating Overlay</text>
      <text x="20" y="74" font-family="-apple-system, sans-serif" font-size="11" font-weight="400" fill="#64748B">Strictly visible only with Gboard</text>
    </g>

    <!-- Card 4 -->
    <g transform="translate(765, 0)">
      <rect width="275" height="90" rx="14" fill="url(#cardGrad)" stroke="#2b3952" stroke-width="1.5"/>
      <text x="20" y="36" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#38BDF8">&lt; 35 MB RAM Budget</text>
      <text x="20" y="58" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Runs on 4GB Android 10</text>
      <text x="20" y="74" font-family="-apple-system, sans-serif" font-size="11" font-weight="400" fill="#64748B">Scales to Android 17 / S26 Ultra</text>
    </g>
  </g>
</svg>